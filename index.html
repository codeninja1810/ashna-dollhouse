<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Grade 2 English practice for Ashna — comprehension, grammar, prose and poetry in a dreamy world full of stars.">
<meta name="theme-color" content="#A78BFA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<title>Ashna's English Dollhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Andika:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap">

<style>
:root{
  --bg1:#FFF2E9;
  --bg2:#F0EAFF;
  --bg3:#E9F6F0;
  --blob1:rgba(255,190,151,.35);
  --blob2:rgba(167,139,250,.22);
  --blob3:rgba(165,223,201,.30);
  --card:#FFFFFF;
  --ink:#4A3B5C;
  --ink-soft:#9C8DB4;
  --lav:#A78BFA;
  --lav-deep:#8465E6;
  --lav-pale:#EDE7FF;
  --peach:#FFBE97;
  --peach-pale:#FFEDE0;
  --mint:#7CC9AC;
  --mint-pale:#E2F5EE;
  --rosep:#F49CBB;
  --rose-pale:#FDE9F1;
  --star:#FFC85C;
  --line:#EFE9F8;
  --shadow:0 12px 32px -14px rgba(122,92,180,.28);
  --shadow-sm:0 6px 18px -8px rgba(122,92,180,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#251E3B;
    --bg2:#1D2137;
    --bg3:#2A2144;
    --blob1:rgba(255,170,130,.10);
    --blob2:rgba(167,139,250,.14);
    --blob3:rgba(140,220,190,.08);
    --card:#332B50;
    --ink:#F2ECFF;
    --ink-soft:#B3A6D4;
    --lav:#B9A1FF;
    --lav-deep:#9E85F2;
    --lav-pale:#463B69;
    --peach:#F5B48E;
    --peach-pale:#4A3550;
    --mint:#8FD6BA;
    --mint-pale:#2E4444;
    --rosep:#F0A5C0;
    --rose-pale:#4C3054;
    --star:#FFD88E;
    --line:#453B66;
    --shadow:0 12px 32px -14px rgba(0,0,0,.55);
    --shadow-sm:0 6px 18px -8px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg1:#251E3B;
  --bg2:#1D2137;
  --bg3:#2A2144;
  --blob1:rgba(255,170,130,.10);
  --blob2:rgba(167,139,250,.14);
  --blob3:rgba(140,220,190,.08);
  --card:#332B50;
  --ink:#F2ECFF;
  --ink-soft:#B3A6D4;
  --lav:#B9A1FF;
  --lav-deep:#9E85F2;
  --lav-pale:#463B69;
  --peach:#F5B48E;
  --peach-pale:#4A3550;
  --mint:#8FD6BA;
  --mint-pale:#2E4444;
  --rosep:#F0A5C0;
  --rose-pale:#4C3054;
  --star:#FFD88E;
  --line:#453B66;
  --shadow:0 12px 32px -14px rgba(0,0,0,.55);
  --shadow-sm:0 6px 18px -8px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;
  color:var(--ink);
  font-family:'Andika','Trebuchet MS',system-ui,sans-serif;
  font-size:17px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  position:relative;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:-1;
}
body::before{width:44vmax;height:44vmax;left:-14vmax;top:-12vmax;background:var(--blob1)}
body::after{width:40vmax;height:40vmax;right:-12vmax;bottom:-14vmax;background:var(--blob2)}

h1,h2,h3,.display{font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;font-weight:800;line-height:1.15;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lav);outline-offset:3px;border-radius:8px}

.wrap{max-width:780px;margin:0 auto;padding:34px 18px 64px}

/* ---------- header ---------- */
header{text-align:center;margin-bottom:26px;position:relative}
h1{font-size:clamp(30px,7vw,42px);color:var(--ink);letter-spacing:-.4px}
h1 .amp{color:var(--lav-deep)}
.tagline{color:var(--ink-soft);font-size:15.5px;margin-top:6px}
.tw{position:absolute;color:var(--star);pointer-events:none;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

/* ---------- home rooms ---------- */
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:680px;margin:0 auto}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:680px;margin:16px auto 0}
.room.mini{flex-direction:row;text-align:left;padding:16px 18px;gap:14px;flex-wrap:wrap;align-items:center}
.room.mini .room-icon{width:46px;height:46px;margin:0}
.room.mini .room-name{font-size:17px;width:calc(100% - 62px)}
.room.mini .room-sub{width:calc(100% - 62px);margin-top:-6px}
.room.mini .room-bar{width:100%;margin-top:2px}
.room.mini .room-count{width:100%;text-align:left}
.room.mini .room-name,.room.mini .room-sub{margin-left:0}
.room{
  background:var(--card);border:none;border-radius:24px;padding:22px 14px 18px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  transition:transform .18s ease, box-shadow .18s ease;
}
.room:hover{transform:translateY(-4px)}
.room:active{transform:translateY(0)}
.room-icon{width:56px;height:56px;margin-bottom:2px}
.room-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px}
.room-sub{font-size:13.5px;color:var(--ink-soft);line-height:1.3}
.room-bar{width:78%;height:8px;border-radius:99px;background:var(--lav-pale);overflow:hidden;margin-top:6px}
.room-bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.room-count{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* ---------- generic card ---------- */
.card{
  position:relative;
  background:var(--card);border:none;border-radius:24px;
  padding:22px 20px 24px;box-shadow:var(--shadow);
}
.back{
  background:var(--card);border:none;border-radius:99px;
  padding:8px 16px;font-size:14px;color:var(--ink-soft);margin-bottom:16px;
  box-shadow:var(--shadow-sm);
}
.back:hover{color:var(--lav-deep)}

.room-title{font-size:26px;color:var(--ink);margin-bottom:2px}
.room-head-sub{color:var(--ink-soft);font-size:14px;margin-bottom:16px}

.topics{display:flex;flex-direction:column;gap:10px}
.topic{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:13px 15px;transition:border-color .15s ease,background .15s ease,transform .15s ease;
}
.topic:hover{border-color:var(--lav);background:var(--lav-pale);transform:translateX(3px)}
.topic-n{
  flex:none;width:34px;height:34px;border-radius:12px;background:var(--lav-pale);
  color:var(--lav-deep);display:grid;place-items:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;
}
.topic.complete .topic-n{background:var(--mint-pale);color:var(--mint)}
.topic-t{flex:1;min-width:0}
.topic-t b{display:block;font-family:'Baloo 2',sans-serif;font-weight:600;font-size:17px}
.topic-t span{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tick{flex:none;color:var(--star);font-size:20px}

/* ---------- voice ---------- */
.speak{
  flex:none;width:46px;height:46px;border-radius:50%;
  background:var(--lav);border:none;position:relative;
  display:grid;place-items:center;box-shadow:0 3px 0 var(--lav-deep);
}
.speak svg{width:24px;height:24px}
.speak:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lav-deep)}
.speak.speaking::after{content:"";position:absolute;inset:-7px;border:3px solid var(--lav);
  border-radius:50%;animation:ring 1.1s ease-out infinite}
@keyframes ring{from{transform:scale(.82);opacity:.85}to{transform:scale(1.28);opacity:0}}
.qrow{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.qrow .qtext{flex:1;margin-bottom:0}

.readstory{
  margin-top:10px;background:var(--card);border:2px solid var(--lav);
  color:var(--lav-deep);border-radius:99px;padding:6px 15px;
  font-family:'Baloo 2',sans-serif;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;position:relative;
}
.readstory svg{width:17px;height:17px}
.readstory.speaking{background:var(--lav-pale)}

.voicecard{max-width:680px;margin:22px auto 0;padding:18px 20px 16px}
.voicecard h3{font-size:19px;color:var(--ink);display:flex;align-items:center;gap:8px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.voicecard h3 svg{width:21px;height:21px;color:var(--lav-deep)}
.vrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.vseg{display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
.vopt{flex:1;min-width:104px;border:2px solid var(--line);border-radius:16px;padding:11px 8px 9px;
  background:var(--card);font-family:'Baloo 2',sans-serif;font-weight:600;font-size:15.5px;
  display:flex;flex-direction:column;align-items:center;gap:1px;transition:border-color .13s,background .13s}
.vopt em{font-style:normal;font-size:22px;line-height:1.2}
.vopt span{font-size:12px;color:var(--ink-soft);font-family:'Andika',sans-serif;font-weight:400}
.vopt.sel{border-color:var(--lav);background:var(--lav-pale)}
.vsel{flex:1;min-width:180px;padding:10px 12px;border:2px solid var(--line);border-radius:13px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:15px}
.vsel:focus{outline:none;border-color:var(--lav)}
.vnote{font-size:13px;color:var(--ink-soft);margin-top:10px;font-style:italic}

.tog{display:flex;align-items:center;gap:11px;font-size:15.5px;cursor:pointer;user-select:none;margin-bottom:12px}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.tog .track{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.tog .track::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog input:checked + .track{background:var(--mint)}
.tog input:checked + .track::after{left:25px}
.tog input:focus-visible + .track{outline:3px solid var(--lav);outline-offset:2px}

/* ---------- quiz ---------- */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.qcount{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{flex:1;height:10px;border-radius:99px;background:var(--lav-pale);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--lav);border-radius:99px;transition:width .35s ease}

.passage{
  background:var(--lav-pale);
  border-radius:16px;padding:15px 17px;margin-bottom:16px;
  font-size:16.5px;line-height:1.75;
}
.passage h4{font-family:'Baloo 2',sans-serif;font-size:17px;margin:0 0 6px;color:var(--lav-deep)}

.qtext{font-family:'Baloo 2',sans-serif;font-weight:600;font-size:21px;line-height:1.35;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  width:100%;text-align:left;background:var(--card);
  border:2px solid var(--line);border-radius:15px;padding:13px 16px;
  font-size:17px;transition:border-color .13s ease,background .13s ease;
}
.opt:hover:not(:disabled){border-color:var(--lav);background:var(--lav-pale)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--mint);background:var(--mint-pale);font-weight:700}
.opt.wrong{border-color:var(--rosep);background:var(--rose-pale);text-decoration:line-through;opacity:.75}

.spellbox{display:flex;gap:9px;flex-wrap:wrap}
.spellbox input{
  flex:1;min-width:180px;font-family:'Andika',sans-serif;font-size:21px;
  padding:12px 15px;border:2px solid var(--line);border-radius:15px;
  background:var(--card);color:var(--ink);
}
.spellbox input:focus{outline:none;border-color:var(--lav)}
.spellbox input:disabled{opacity:.85}
.go{
  background:var(--lav);color:#fff;border:none;border-radius:15px;padding:12px 24px;
  font-family:'Baloo 2',sans-serif;font-weight:600;font-size:17px;
  box-shadow:0 4px 0 var(--lav-deep);
}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--lav-deep)}
.go:disabled{opacity:.45;box-shadow:none;cursor:default}

.hint{font-size:14px;color:var(--ink-soft);margin-top:9px;font-style:italic}

.fb{margin-top:15px;border-radius:15px;padding:13px 16px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.fb.yes{background:var(--mint-pale)}
.fb.no{background:var(--rose-pale)}
.fb b{font-family:'Baloo 2',sans-serif;font-size:18px;display:block;margin-bottom:1px}
.fb.yes b{color:var(--mint)}
.fb.no b{color:var(--rosep)}
.fb-ic{font-size:22px;line-height:1;flex:none}
.fb .note{font-family:'Caveat',cursive;font-size:19px;color:var(--ink-soft);display:block;margin-top:5px}

.nextrow{display:flex;justify-content:flex-end;margin-top:15px}

.burst{position:absolute;left:50%;top:40%;pointer-events:none;font-size:22px;color:var(--star);
  animation:fly .9s ease-out forwards;z-index:5}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rr)) scale(.6);opacity:0}}

/* ---------- results ---------- */
.result{text-align:center;padding:12px 4px 4px}
.result h2{font-size:30px;color:var(--ink);margin-bottom:6px}
.stars{font-size:38px;letter-spacing:6px;margin:12px 0 4px;color:var(--star)}
.stars span{display:inline-block;animation:pop .5s cubic-bezier(.5,1.8,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.score{font-size:19px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.ghost{background:var(--card);border:2px solid var(--line);border-radius:15px;padding:11px 20px;
  font-family:'Baloo 2',sans-serif;font-weight:600;font-size:16px}
.ghost:hover{border-color:var(--lav);color:var(--lav-deep)}
.missed{text-align:left;margin-top:22px;border-top:2px dashed var(--line);padding-top:16px}
.missed h3{font-size:17px;color:var(--ink-soft);margin-bottom:8px;font-weight:600}
.missed li{margin-bottom:7px;font-size:15.5px}
.missed b{color:var(--mint)}

.total{max-width:680px;margin:20px auto 0;text-align:center;color:var(--ink-soft);font-size:15px}

/* ---------- reader ---------- */
.readhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.readtext{font-size:17.5px;line-height:1.85}
.readtext p{margin:0 0 14px}
.poemtext{font-family:'Baloo 2',sans-serif;font-weight:500;font-size:19px;line-height:1.75;text-align:center}
.poemtext p{margin:0 0 20px}

footer{text-align:center;margin-top:34px;font-size:13px;color:var(--ink-soft)}
.reset{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:13px;padding:4px}
.reset:hover{color:var(--lav-deep)}

@media (max-width:520px){
  .wrap{padding-top:26px}
  .tw{display:none}
  .heroes{grid-template-columns:1fr;gap:12px}
  .minis{grid-template-columns:1fr;gap:12px}
  .room{padding:17px 10px 14px;border-radius:20px}
  .room-name{font-size:17px}
  .room-sub{font-size:12px}
  .room-icon{width:46px;height:46px}
  .qtext{font-size:19px}
  .speak{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr">
    <h1>Ashna's English <span class="amp">Dollhouse</span></h1>
    <p class="tagline">Your story, your poems, your word games ✦</p>
  </header>
  <main id="app"></main>
  <footer>
    <p>Made for Ashna &middot; Grade 2 English</p>
    <button class="reset" id="reset">Start all the rooms again</button>
  </footer>
</div>

<script>
"use strict";

/* ================= CONTENT ================= */

const ROOMS = [
  {
    id:"comprehension", name:"Comprehension", sub:"Unseen Passage", accent:"var(--peach)",
    icon:'<circle cx="22" cy="22" r="19" fill="#9BC1E0"/><path d="M12 14h20v18a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2z" fill="#fff"/><path d="M16 20h12M16 25h12M16 30h8" stroke="#48273F" stroke-width="2" stroke-linecap="round"/>',
    topics:[
      { id:"c1", name:"The Little Duck", title:"The Little Duck",
        passage:"Dolly is a little duck. She lives near a big pond. Every morning she swims in the cool water. Dolly has soft yellow feathers and a small orange beak. She likes to eat bread and tiny fish. When it rains, Dolly is very happy. She flaps her wings and quacks loudly. Her mother calls her home when the sun goes down.",
        qs:[
          {t:"mcq",q:"What is the little duck's name?",o:["Polly","Dolly","Molly"],a:1,why:"The very first line tells us — “Dolly is a little duck.”"},
          {t:"mcq",q:"Where does Dolly live?",o:["Near a big pond","In a tall tree","Inside a cave"],a:0,why:"“She lives near a big pond.”"},
          {t:"mcq",q:"What colour are Dolly's feathers?",o:["Brown","White","Yellow"],a:2,why:"“Dolly has soft yellow feathers.”"},
          {t:"mcq",q:"What does Dolly do when it rains?",o:["She hides under a leaf","She flaps her wings and quacks","She goes to sleep"],a:1,why:"Rain makes her happy, so she flaps and quacks loudly."},
          {t:"mcq",q:"Who calls Dolly home?",o:["Her mother","Her friend","The farmer"],a:0,why:"“Her mother calls her home when the sun goes down.”"},
          {t:"spell",q:"Write the naming word for the water Dolly lives near.",a:"pond",hint:"It rhymes with ‘fond’ — 4 letters."}
        ]},
      { id:"c2", name:"Meera's Garden", title:"Meera's Garden",
        passage:"Meera has a small garden behind her house. She grows red roses and yellow sunflowers. Every evening she waters the plants with a green can. A brown squirrel comes and sits on the wall. Meera gives it a few nuts. The squirrel is not afraid of her. It is her little friend.",
        qs:[
          {t:"mcq",q:"Where is Meera's garden?",o:["In front of her school","Behind her house","On the roof"],a:1,why:"“Meera has a small garden behind her house.”"},
          {t:"mcq",q:"Which two flowers does Meera grow?",o:["Roses and sunflowers","Lilies and daisies","Roses and tulips"],a:0,why:"“She grows red roses and yellow sunflowers.”"},
          {t:"mcq",q:"What colour is her watering can?",o:["Blue","Red","Green"],a:2,why:"“She waters the plants with a green can.”"},
          {t:"mcq",q:"Who comes and sits on the wall?",o:["A brown squirrel","A black cat","A little bird"],a:0,why:"A brown squirrel comes to visit her every evening."},
          {t:"mcq",q:"Why is the squirrel not afraid of Meera?",o:["Because it cannot see her","Because she is its little friend","Because it is very brave"],a:1,why:"The passage ends: “It is her little friend.”"},
          {t:"spell",q:"Meera is a special name, so it is a ______ noun.",a:"proper",hint:"Special names start with a capital letter."}
        ]},
      { id:"c3", name:"The Kind Elephant", title:"The Kind Elephant",
        passage:"Raju is a big grey elephant. He lives in a green forest with his friends. One hot day, a little rabbit could not find any water. Raju filled his long trunk with water from the river. He gave the water to the thirsty rabbit. “Thank you, Raju!” said the rabbit. Raju was very happy that he could help.",
        qs:[
          {t:"mcq",q:"What is the elephant's name?",o:["Raja","Raju","Ramu"],a:1,why:"“Raju is a big grey elephant.”"},
          {t:"mcq",q:"Where does Raju live?",o:["In a green forest","In a zoo","Near a village"],a:0,why:"“He lives in a green forest with his friends.”"},
          {t:"mcq",q:"Who could not find any water?",o:["A little rabbit","A baby deer","A thirsty bird"],a:0,why:"On a hot day the little rabbit could find no water."},
          {t:"mcq",q:"What did Raju use to carry the water?",o:["A big leaf","A clay pot","His long trunk"],a:2,why:"“Raju filled his long trunk with water from the river.”"},
          {t:"mcq",q:"How did Raju feel after helping?",o:["Tired","Very happy","Puzzled"],a:1,why:"He was very happy that he could help."},
          {t:"spell",q:"A baby elephant is called a ______.",a:"calf",hint:"Same word as a baby hippo! 4 letters."}
        ]}
    ]
  },

function roomScore(room){ return room.topics.reduce((n,t)=>n+(saved[t.id]?saved[t.id].right:0),0); }

/* ================= VOICE ================= */

const VKEY = "ashna-dollhouse-voice-v1";
const speech = { on:true, mode:"neerja", uri:null, voices:[] };
try {
  const p = JSON.parse(localStorage.getItem(VKEY) || "{}");
  if(typeof p.on === "boolean") speech.on = p.on;
  if(p.uri) speech.uri = p.uri;
} catch(e){}
function saveVoicePrefs(){ try{ localStorage.setItem(VKEY, JSON.stringify({on:speech.on, mode:speech.mode, uri:speech.uri})); }catch(e){} }

/* Recorded Indian voice (Neerja) shipped with the site as MP3 clips.
   play() tries the clip first and falls back to the device voice if it is missing. */
const AUDIO_BASE = location.hostname.endsWith("vercel.app")
  ? "https://codeninja1810.github.io/ashna-dollhouse/audio/"
  : "audio/";
let currentAudio = null;
function play(id, fallbackText, el){
  if(!speech.on) return;
  hush();
  if(speech.mode === "device" || !id){ say(fallbackText, el); return; }
  const a = new Audio(AUDIO_BASE + speech.mode + "/" + id + ".mp3");
  currentAudio = a;
  const off = () => { if(el) el.classList.remove("speaking"); };
  if(el) el.classList.add("speaking");
  a.onended = off;
  a.onerror = () => { off(); say(fallbackText, el); };
  a.play().catch(() => { off(); say(fallbackText, el); });
}

const VOICE_HINTS = [
  {re:/neerja/i,  s:220, tag:"Indian aunty voice"},
  {re:/prabhat/i, s:210, tag:"Indian uncle voice"},
  {re:/veena/i,   s:200, tag:"Indian aunty voice"},
  {re:/rishi/i,   s:190, tag:"Indian uncle voice"},
  {re:/heera/i,   s:180, tag:"Indian voice"},
  {re:/lekha/i,   s:120, tag:"Hindi voice"},
  {re:/kalpana|swara|madhur|hemant|aarav|ananya/i, s:170, tag:"Indian voice"}
];

function voiceScore(v){
  for(const h of VOICE_HINTS){ if(h.re.test(v.name)) return h.s; }
  const L = (v.lang||"").toLowerCase().replace("_","-");
  if(L === "en-in") return 150;
  if(L === "hi-in") return 100;
  if(L.startsWith("en-gb")) return 40;
  if(L.startsWith("en")) return 30;
  return 0;
}
function voiceTag(v){
  for(const h of VOICE_HINTS){ if(h.re.test(v.name)) return h.tag; }
  const L = (v.lang||"").toLowerCase().replace("_","-");
  if(L === "en-in") return "Indian voice";
  return "";
}
function refreshVoices(){
  if(!window.speechSynthesis) return;
  const all = speechSynthesis.getVoices() || [];
  speech.voices = all
    .filter(v => /^en|^hi/i.test(v.lang))
    .map(v => ({v, s:voiceScore(v)}))
    .sort((a,b) => b.s - a.s)
    .map(x => x.v);
}
function currentVoice(){
  if(!speech.voices.length) refreshVoices();
  if(speech.uri){
    const f = speech.voices.find(v => v.voiceURI === speech.uri);
    if(f) return f;
  }
  return speech.voices[0] || null;
}
function cleanForSpeech(s){
  return String(s)
    .replace(/[“”‘’]/g,"")
    .replace(/→/g,", ")
    .replace(/×/g," and ")
    .replace(/\.{3}|…/g,", ")
    .replace(/_{2,}/g," blank ")
    .replace(/\s+/g," ").trim();
}
function say(text, el){
  if(!speech.on || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
    const v = currentVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = "en-IN"; }
    u.rate = 0.9; u.pitch = 1;
    if(el){
      el.classList.add("speaking");
      u.onend = () => el.classList.remove("speaking");
      u.onerror = () => el.classList.remove("speaking");
    }
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
}
function questionSpeech(q){
  if(q.t === "mcq") return q.q + " Is it: " + q.o.join("? Or: ") + "?";
  return q.q + (q.hint ? " Here is a hint. " + q.hint : "");
}
if(window.speechSynthesis){
  refreshVoices();
  speechSynthesis.onvoiceschanged = () => { refreshVoices(); fillVoiceSelect(); };
}
function fillVoiceSelect(){
  const sel = document.getElementById("vsel");
  if(!sel) return;
  const cur = currentVoice();
  sel.innerHTML = speech.voices.length
    ? speech.voices.slice(0,10).map(v=>{
        const tag = voiceTag(v);
        return '<option value="'+esc(v.voiceURI)+'"'+(cur && v.voiceURI===cur.voiceURI?" selected":"")+'>'+
          esc(v.name + (tag ? " — " + tag : ""))+'</option>';
      }).join("")
    : '<option value="">No voices found on this device</option>';
}

/* ================= HELPERS ================= */

const app = document.getElementById("app");
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g," "); }

const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path d="M15.5 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SPK_INK = SPK.replace(/#fff/g,"currentColor");

/* twinkling stars in the header */
(function(){
  const hdr = document.getElementById("hdr");
  const spots = [[6,18],[16,72],[28,8],[64,84],[78,14],[90,60],[46,92],[84,88]];
  spots.forEach((p,i)=>{
    const s = document.createElement("span");
    s.className = "tw"; s.textContent = "✦";
    s.style.top = p[0]+"%"; s.style.left = p[1]+"%";
    s.style.fontSize = (9+(i%3)*4)+"px";
    s.style.animationDelay = (i*0.45)+"s";
    s.setAttribute("aria-hidden","true");
    hdr.appendChild(s);
  });
})();

function burst(host){
  if(!host || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let i=0;i<8;i++){
    const s = document.createElement("span");
    s.className = "burst"; s.textContent = "★";
    s.style.setProperty("--dx", (Math.random()*180-90)+"px");
    s.style.setProperty("--dy", (-50-Math.random()*100)+"px");
    s.style.setProperty("--rr", (Math.random()*160-80)+"deg");
    host.appendChild(s);
    setTimeout(()=>s.remove(), 950);
  }
}

/* ================= VIEWS ================= */

function renderHome(){
  const hero = u => {
    const tot = roomTotal(u), got = roomScore(u);
    const pct = tot ? Math.round(got/tot*100) : 0;
    return '<button class="room'+(u.hero?"":" mini")+'" data-room="'+u.id+'">'+
      '<svg class="room-icon" viewBox="0 0 44 44" aria-hidden="true">'+u.icon+'</svg>'+
      '<span class="room-name">'+esc(u.name)+'</span>'+
      '<span class="room-sub">'+esc(u.sub)+'</span>'+
      '<span class="room-bar"><i style="width:'+pct+'%;background:'+u.accent+'"></i></span>'+
      '<span class="room-count">'+got+' / '+tot+' ★</span>'+
      '</button>';
  };
  const heroes = UNITS.filter(u=>u.hero).map(hero).join("");
  const minis  = UNITS.filter(u=>!u.hero).map(hero).join("");

  const allTot = UNITS.reduce((n,u)=>n+roomTotal(u),0);
  const allGot = UNITS.reduce((n,u)=>n+roomScore(u),0);

  app.innerHTML =
    '<div class="heroes">'+heroes+'</div>'+
    '<div class="minis">'+minis+'</div>'+
    '<div class="card voicecard">'+
      '<div class="vhead"><h3>'+SPK_INK+' Neerja reads to you</h3>'+
      '<button class="go" id="vtest">Hear her</button></div>'+
      '<label class="tog"><input type="checkbox" id="togread"'+(speech.on?" checked":"")+'>'+
        '<span class="track"></span>Read everything out loud</label>'+
    '</div>'+
    '<p class="total">'+allGot+' of '+allTot+' stars collected ✦</p>';

  app.querySelectorAll("[data-room]").forEach(b=>{
    b.addEventListener("click",()=>{ view.at="room"; view.room=b.dataset.room; render(); });
  });
  document.getElementById("togread").addEventListener("change", e=>{
    speech.on = e.target.checked; saveVoicePrefs();
    if(!speech.on) hush();
  });
  document.getElementById("vtest").addEventListener("click", e=>{
    const was = speech.on; speech.on = true;
    play("ui-hello", "Hello Ashna! I am your reading friend. Let us practise English together!", e.currentTarget);
    speech.on = was;
  });
}

function renderRoom(){
  const r = UNITS.find(x=>x.id===view.room);
  let list = "";
  READS.filter(rd=>rd.room===r.id).forEach(rd=>{
    list += '<button class="topic reader" data-read="'+rd.id+'">'+
      '<span class="topic-n">📖</span>'+
      '<span class="topic-t"><b>'+esc(rd.title)+'</b><span>'+(rd.kind==="poem"?"read the whole poem":"read the whole story")+'</span></span>'+
      '</button>';
  });
  r.topics.forEach((t,idx)=>{
    const rec = saved[t.id];
    const got = rec ? rec.right : 0;
    const complete = got === t.qs.length;
    list += '<button class="topic'+(complete?" complete":"")+'" data-topic="'+t.id+'">'+
      '<span class="topic-n">'+(idx+1)+'</span>'+
      '<span class="topic-t"><b>'+esc(t.name)+'</b><span>'+got+' / '+t.qs.length+' stars</span></span>'+
      (complete?'<span class="tick" aria-label="all correct">★</span>':'')+
      '</button>';
  });

  app.innerHTML =
    '<button class="back" id="back">← Back to all rooms</button>'+
    '<div class="card">'+
      '<h2 class="room-title">'+esc(r.name)+'</h2>'+
      '<p class="room-head-sub">'+esc(r.sub)+'</p>'+
      '<div class="topics">'+list+'</div>'+
    '</div>';

  document.getElementById("back").addEventListener("click",()=>{ view.at="home"; render(); });
  app.querySelectorAll("[data-read]").forEach(b=>{
    b.addEventListener("click",()=>{ view.at="read"; view.read=b.dataset.read; render(); });
  });
  app.querySelectorAll("[data-topic]").forEach(b=>{
    b.addEventListener("click",()=>{
      view.at="quiz"; view.topic=b.dataset.topic;
      view.i=0; view.right=0; view.answered=false; view.picked=null; view.missed=[];
      render();
    });
  });
}

function renderRead(){
  const rd = READS.find(x=>x.id===view.read);
  if(!rd){ view.at="room"; return render(); }
  const cls = rd.kind==="poem" ? "readtext poemtext" : "readtext";
  const body = rd.paras.map(p=>'<p>'+esc(p).replace(/\n/g,"<br>")+'</p>').join("");

  app.innerHTML =
    '<button class="back" id="back">← Back to '+esc(UNITS.find(x=>x.id===rd.room).name)+'</button>'+
    '<div class="card">'+
      '<div class="readhead">'+
        '<div><h2 class="room-title">'+esc(rd.title)+'</h2>'+
        (rd.by?'<p class="room-head-sub">by '+esc(rd.by)+'</p>':'')+'</div>'+
        '<button class="speak" id="readall" aria-label="Read it all to me">'+SPK+'</button>'+
      '</div>'+
      '<div class="'+cls+'">'+body+'</div>'+
      '<div class="nextrow"><button class="go" id="readbig">'+SPK_INK.replace("currentColor","#fff")+' Read it to me</button></div>'+
    '</div>';

  document.getElementById("back").addEventListener("click",()=>{ view.at="room"; view.room=rd.room; render(); });
  const go = (el)=>{
    const was = speech.on; speech.on = true;
    play(rd.id, readSpeechText(rd), el);
    speech.on = was;
  };
  document.getElementById("readall").addEventListener("click", e=>go(e.currentTarget));
  document.getElementById("readbig").addEventListener("click", e=>go(e.currentTarget));
}

function renderQuiz(){
  const t = topicOf(view.room, view.topic);
  if(view.i >= t.qs.length){ return renderResult(t); }
  const q = t.qs[view.i];
  const pct = Math.round(view.i / t.qs.length * 100);

  let body = "";
  if(t.passage){
    body += '<div class="passage"><h4>'+esc(t.title||t.name)+'</h4>'+esc(t.passage)+
      '<br><button class="readstory" id="readstory">'+SPK_INK+' Read the story to me</button></div>';
  }
  body += '<div class="qrow"><p class="qtext">'+esc(q.q)+'</p>'+
    '<button class="speak" id="speakq" aria-label="Read the question aloud">'+SPK+'</button></div>';

  if(q.t === "mcq"){
    body += '<div class="opts">';
    q.o.forEach((o,idx)=>{
      let cls = "opt";
      if(view.answered){
        if(idx === q.a) cls += " right";
        else if(idx === view.picked) cls += " wrong";
      }
      body += '<button class="'+cls+'" data-opt="'+idx+'"'+(view.answered?" disabled":"")+'>'+esc(o)+'</button>';
    });
    body += '</div>';
  } else {
    const val = view.answered ? esc(view.picked) : "";
    body += '<div class="spellbox">'+
      '<input id="sp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" '+
      'value="'+val+'"'+(view.answered?" disabled":"")+' aria-label="Type your answer">'+
      '<button class="go" id="gobtn"'+(view.answered?" disabled":"")+'>Check</button></div>';
    if(q.hint && !view.answered) body += '<p class="hint">Hint: '+esc(q.hint)+'</p>';
  }

  if(view.answered){
    const ok = view.wasRight;
    const correct = q.t === "mcq" ? q.o[q.a] : q.a;
    body += '<div class="fb '+(ok?"yes":"no")+'">'+
      '<span class="fb-ic">'+(ok?"★":"↺")+'</span>'+
      '<span><b>'+(ok?"Well done, Ashna!":"Not quite — the answer is “"+esc(correct)+"”")+'</b>'+
      esc(q.why || q.hint || "")+
      (ok?"":'<span class="note">Read it once more, then carry on.</span>')+
      '</span></div>'+
      '<div class="nextrow"><button class="go" id="next">'+
        (view.i+1 < t.qs.length ? "Next →" : "See my stars ★")+'</button></div>';
  }

  app.innerHTML =
    '<button class="back" id="back">← Back to '+esc(UNITS.find(x=>x.id===view.room).name)+'</button>'+
    '<div class="card">'+
      '<div class="qhead"><span class="qcount">Question '+(view.i+1)+' of '+t.qs.length+'</span>'+
      '<span class="pbar"><i style="width:'+pct+'%"></i></span></div>'+
      body+
    '</div>';

  document.getElementById("back").addEventListener("click",()=>{ view.at="room"; render(); });

  const qid = t.id+"-"+view.i+"-q";
  const speakBtn = document.getElementById("speakq");
  if(speakBtn) speakBtn.addEventListener("click", ()=>{
    const was = speech.on; speech.on = true;
    play(qid, questionSpeech(q), speakBtn);
    speech.on = was;
  });
  const rs = document.getElementById("readstory");
  if(rs) rs.addEventListener("click", ()=>{
    const was = speech.on; speech.on = true;
    play(t.id+"-pass", (t.title||t.name)+". "+t.passage, rs);
    speech.on = was;
  });

  if(!view.answered){
    if(q.t === "mcq"){
      app.querySelectorAll("[data-opt]").forEach(b=>{
        b.addEventListener("click",()=>answer(t, q, parseInt(b.dataset.opt,10)));
      });
    } else {
      const inp = document.getElementById("sp");
      const go = ()=>{ if(inp.value.trim()) answer(t, q, inp.value); };
      document.getElementById("gobtn").addEventListener("click", go);
      inp.addEventListener("keydown", e=>{ if(e.key === "Enter" || e.keyCode === 13) go(); });
      if(!speech.on) inp.focus();
    }
    play(qid, questionSpeech(q), speakBtn);
  } else {
    const n = document.getElementById("next");
    if(n){ n.addEventListener("click", ()=>{ view.i++; view.answered=false; view.picked=null; render(); }); n.focus(); }
  }
}

function answer(t, q, given){
  let ok;
  if(q.t === "mcq"){ ok = (given === q.a); }
  else { ok = q.cs ? (String(given).trim() === q.a) : (norm(given) === norm(q.a)); }
  view.answered = true;
  view.picked = given;
  view.wasRight = ok;
  if(ok) view.right++;
  else view.missed.push({ q:q.q, a:(q.t === "mcq" ? q.o[q.a] : q.a) });
  render();
  const card = app.querySelector(".card");
  const i = t.qs.indexOf(q);
  if(ok){
    burst(card);
    play("ui-yay", "Well done, Ashna!");
  } else {
    const correct = q.t === "mcq" ? q.o[q.a] : q.a;
    play(t.id+"-"+i+"-fb", "Not quite. The answer is: "+correct+". "+(q.why||""));
  }
}

function renderResult(t){
  const total = t.qs.length;
  const prev = saved[t.id] ? saved[t.id].right : 0;
  if(view.right > prev){ saved[t.id] = { right:view.right, total:total }; save(); }

  const pct = view.right / total;
  const shown = Math.max(1, Math.round(pct*5));
  let stars = "";
  for(let i=0;i<5;i++){
    stars += '<span style="animation-delay:'+(i*0.13)+'s">'+(i<shown?"★":"☆")+'</span>';
  }
  let msg, msgClip;
  if(pct === 1){ msg = "Every single one right!"; msgClip = "ui-r100"; }
  else if(pct >= .8){ msg = "That was really good!"; msgClip = "ui-r80"; }
  else if(pct >= .5){ msg = "Nice work — nearly there."; msgClip = "ui-r50"; }
  else { msg = "Good try! Let's go once more."; msgClip = "ui-r0"; }

  let miss = "";
  if(view.missed.length){
    miss = '<div class="missed"><h3>Worth another look</h3><ul>';
    view.missed.forEach(m=>{ miss += '<li>'+esc(m.q)+' <b>'+esc(m.a)+'</b></li>'; });
    miss += '</ul></div>';
  }

  app.innerHTML =
    '<div class="card">'+
      '<div class="result">'+
        '<h2>'+esc(msg)+'</h2>'+
        '<div class="stars" aria-label="'+shown+' out of 5 stars">'+stars+'</div>'+
        '<p class="score">'+view.right+' out of '+total+' right in '+esc(t.name)+'</p>'+
        '<div class="result-actions">'+
          '<button class="go" id="again">Try again</button>'+
          '<button class="ghost" id="toroom">Other topics</button>'+
          '<button class="ghost" id="tohome">All rooms</button>'+
        '</div>'+
        miss+
      '</div>'+
    '</div>';

  if(pct === 1) burst(app.querySelector(".card"));
  play(msgClip, msg + " You collected " + view.right + " out of " + total + " stars.");

  document.getElementById("again").addEventListener("click",()=>{
    view.i=0; view.right=0; view.answered=false; view.picked=null; view.missed=[]; render();
  });
  document.getElementById("toroom").addEventListener("click",()=>{ view.at="room"; render(); });
  document.getElementById("tohome").addEventListener("click",()=>{ view.at="home"; render(); });
}

function render(){
  hush();
  if(view.at === "home") renderHome();
  else if(view.at === "room") renderRoom();
  else if(view.at === "read") renderRead();
  else renderQuiz();
  window.scrollTo({top:0,behavior:"instant"});
}

document.getElementById("reset").addEventListener("click",()=>{
  saved = {}; save(); view.at="home"; render();
});

render();
</script>
